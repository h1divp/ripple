output: "internal/db/models"
pkgname: "models"
no_sub_packages: true

psql:
  # dsn is in .env as PSQL_DSN
  driver: "github.com/jackc/pgx/v5/stdlib"
  shared_schema: main
  schemas:
    - auth
    - public

plugins:
  models:
    destination: internal/db/models
    pkgname: models
  queries:
    destination: internal/db/queries
    pkgname: queries
  factory:
    destination: internal/db/factory
    pkgname: factory
  dberrors:
    destination: internal/db/errors
    pkgname: dberrors
  dbinfo:
    disabled: true
