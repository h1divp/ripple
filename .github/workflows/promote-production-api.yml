name: Promote API from Staging to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull secrets
        run: |
          export INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id='${{ secrets.INFISICAL_CLIENT_ID }}' \
            --client-secret='${{ secrets.INFISICAL_CLIENT_SECRET }}' \
            --silent \
            --plain)
          infisical export \
            --token=$INFISICAL_TOKEN \
            --env=production \
            --format=dotenv \
            --path="/api" \
            --projectId='${{ secrets.INFISICAL_PROJECT_ID }}' \
            > .env.api.production

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USER }}
          key: ${{ secrets.API_SERVER_SSH_KEY }}
          source: "deploy/docker-compose.api.yml,.env.api.production"
          target: "/srv/api"
          strip_components: 2

      - name: Promote staging to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USER }}
          key: ${{ secrets.API_SERVER_SSH_KEY }}
          script: |
            cd /srv/api
            cp .staging-tag .production-tag
            export IMAGE_TAG_STAGING=$(cat .staging-tag)
            export IMAGE_TAG_PROD=$(cat .production-tag)
            docker compose -f docker-compose.api.yml pull api-production
            docker compose -f docker-compose.api.yml up -d --no-deps --force-recreate api-production
