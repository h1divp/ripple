name: Promote API From Staging To Production
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional API image tag for rollbacks (e.g. api-v0.1.1)'
        required: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to production
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.API_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail

          # Parse the script into parameters for ssm send-command
          PARAMETERS="$(jq -n \
            --rawfile script deploy/scripts/deploy-api-prod.sh \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg tag "$IMAGE_TAG" \
            '{commands: ["DEPLOY_BUCKET=" + ($bucket|@sh) + " IMAGE_TAG=" + ($tag|@sh) + "\n" + $script]}')"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy api to production" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ vars.API_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output yaml
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text
