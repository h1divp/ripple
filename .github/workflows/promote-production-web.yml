name: Promote Web from Staging to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_SERVER_HOST }}
          username: ${{ secrets.WEB_SERVER_USER }}
          key: ${{ secrets.WEB_SERVER_SSH_KEY }}
          source: "deploy/docker-compose.web.yml"
          target: "/srv/web"
          strip_components: 1

      - name: Promote staging to production
        uses: appleboy/ssh-action@v1
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        with:
          host: ${{ secrets.WEB_SERVER_HOST }}
          username: ${{ secrets.WEB_SERVER_USER }}
          key: ${{ secrets.WEB_SERVER_SSH_KEY }}
          envs:
            - INFISICAL_CLIENT_ID
            - INFISICAL_CLIENT_SECRET
            - INFISICAL_PROJECT_ID
          script: |
            cd /srv/web
            cp .staging-tag .production-tag
            export IMAGE_TAG_STAGING=$(cat .staging-tag)
            export IMAGE_TAG_PROD=$(cat .production-tag)
            docker compose -f docker-compose.web.yml pull web-production
            docker compose -f docker-compose.web.yml up -d --no-deps --force-recreate web-production
