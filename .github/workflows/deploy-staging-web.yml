name: Deploy Web to Staging

on:
  workflow_run:
    workflows:
      - "Build and Push WEB Image"
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_SERVER_HOST }}
          username: ${{ secrets.WEB_SERVER_USER }}
          key: ${{ secrets.WEB_SERVER_SSH_KEY }}
          source: "deploy/docker-compose.web.yml"
          target: "/srv/web"
          strip_components: 2

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEB_SERVER_HOST }}
          username: ${{ secrets.WEB_SERVER_USER }}
          key: ${{ secrets.WEB_SERVER_SSH_KEY }}
          script: |
            cd /srv/web
            echo ${{ github.event.workflow_run.head_branch }} > .staging-tag
            export IMAGE_TAG_STAGING=$(cat .staging-tag)
            export IMAGE_TAG_PROD=$(cat .production-tag 2>/dev/null || echo "none")
            docker compose -f docker-compose.web.yml pull web-staging
            docker compose -f docker-compose.web.yml up -d --no-deps --force-recreate web-staging
