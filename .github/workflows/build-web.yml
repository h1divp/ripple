name: Build and Push Web Image

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          target: deployment
          tags: |
            ghcr.io/h1divp/ripple/web:${{ github.event.release.tag_name }}
            ghcr.io/h1divp/ripple/web:${{ github.sha }}
