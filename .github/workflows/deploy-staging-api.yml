name: Deploy API to Staging

on:
  workflow_run:
    workflows:
      - "Build and Push API Image"
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. api-v0.1.1)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: >
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get install -y infisical       uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get install -y infisical       

      - name: Pull secrets
        run: |
          export INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id='${{ secrets.INFISICAL_CLIENT_ID }}' \
            --client-secret='${{ secrets.INFISICAL_CLIENT_SECRET }}' \
            --silent \
            --plain)
          infisical export \
            --token=$INFISICAL_TOKEN \
            --env=staging \
            --format=dotenv \
            --path="/api" \
            --projectId='${{ secrets.INFISICAL_PROJECT_ID }}' \
            > .env.api.staging

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USER }}
          key: ${{ secrets.API_SERVER_SSH_KEY }}
          source: "deploy/docker-compose.api.yml,.env.api.staging"
          target: "/srv/api"
          strip_components: 2

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USER }}
          key: ${{ secrets.API_SERVER_SSH_KEY }}
          envs: IMAGE_TAG
          env:
            IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
          script: |
            cd /srv/api
            echo $IMAGE_TAG > .staging-tag
            export IMAGE_TAG_STAGING=$IMAGE_TAG
            export IMAGE_TAG_PROD=$(cat .production-tag 2>/dev/null || echo "none")
            docker compose -f docker-compose.api.yml pull api-staging
            docker compose -f docker-compose.api.yml up -d --no-deps --force-recreate api-staging
